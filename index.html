<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍷 Vinprovningen</title><style>
:root{--w:#722f37;--w2:#4e2026;--bg:#f5f1eb;--card:#fff;--line:#e4ddd5;--gold:#b58a45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2b2420;font:16px system-ui,sans-serif}header{background:linear-gradient(135deg,var(--w2),var(--w));color:white;padding:20px}header>div,main{max-width:1050px;margin:auto}header>div{display:flex;justify-content:space-between;gap:15px;align-items:center}h1,h2,h3{margin-top:0}h1{font:28px Georgia,serif}.sub{opacity:.8}.nav{display:flex;gap:8px;flex-wrap:wrap}.wrap{padding:25px 15px}.card{background:var(--card);padding:23px;border-radius:17px;border:1px solid var(--line);margin-bottom:18px;box-shadow:0 8px 25px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}header>div{flex-direction:column;align-items:flex-start}}button{border:0;border-radius:9px;padding:12px 17px;font-weight:700;cursor:pointer}.primary{background:var(--w);color:#fff}.secondary{background:#eee7df}.danger{background:#a33a3a;color:#fff}.gold{background:var(--gold);color:#fff}.names{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:600px){.names{grid-template-columns:repeat(2,1fr)}}.name{padding:20px;background:#faf7f3;border:1px solid var(--line)}.wine{border:1px solid var(--line);padding:17px;border-radius:13px}.wine h3{color:var(--w);font:22px Georgia,serif}label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #d7cec5;border-radius:8px;font:inherit}textarea{min-height:85px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.notice{padding:13px 15px;border-left:4px solid var(--gold);background:#f6eee3;border-radius:8px;margin:12px 0}.ok{background:#edf6ef;border-color:#2e6b45}.err{background:#fff0f0;border-color:#a33a3a}.hidden{display:none!important}.score{background:#faf7f3;border:1px solid var(--line);padding:15px;border-radius:10px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.points{font-size:22px;color:var(--w);font-weight:800}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#faf7f3}.small{font-size:13px;color:#756a63}.badge{display:inline-block;padding:4px 7px;background:#eee7df;border-radius:99px;font-size:12px}
</style></head><body><header><div><div><h1>🍷 Vinprovningen</h1><div class="sub">Tre viner · åtta deltagare · gemensamt online</div></div><div class="nav"><button class="secondary" onclick="home()">Hem</button><button class="secondary" onclick="admin()">Admin</button><button class="secondary" onclick="results()">Resultat</button></div></div></header><main class="wrap">
<section id="home"><div class="card"><h2>Välkommen!</h2><p>Välj namn. Svaren sparas centralt i Supabase så att alla som använder sidan ser samma provning.</p><div id="homeMsg"></div><div class="names" id="names"></div></div></section>
<section id="form" class="hidden"><div class="card"><h2 id="ft"></h2><div class="notice">Gissa land, pris och smak för varje vin. Välj sedan din favorit.</div><div class="grid" id="forms"></div><h3 style="margin-top:25px">Vilket vin är godast?</h3><div class="actions" id="favs"></div><div class="actions"><button class="primary" onclick="savePerson()">Spara mina svar</button><button class="secondary" onclick="home()">Avbryt</button></div><div id="formMsg"></div></div></section>
<section id="admin" class="hidden"><div class="card" id="login"><h2>🔐 Admin</h2><label>E-post</label><input id="email" type="email"><label>Lösenord</label><input id="pass" type="password" onkeydown="if(event.key==='Enter')login()"><div class="actions"><button class="primary" onclick="login()">Logga in</button></div><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><h2>Facit</h2><div class="grid" id="answers"></div><div class="actions"><button class="primary" onclick="saveAnswers()">Spara facit</button><button class="secondary" onclick="logout()">Logga ut</button></div><div id="answerMsg"></div></div><div class="card"><h2>Status</h2><div id="status"></div><div class="actions"><button class="gold" onclick="lock()">🔒 Lås och publicera resultat</button><button class="danger" onclick="clearParticipants()">Radera deltagarsvar</button><button class="secondary" onclick="resetAll()">Återställ allt</button></div></div></div></section>
<section id="results" class="hidden"><div class="card"><h2>📊 Resultat</h2><div id="result"></div><div class="actions"><button class="primary" onclick="home()">Tillbaka</button></div></div></section></main>
<script>
/*
  Vinprovningen – Supabase-konfiguration
  Använd endast Project URL + Publishable/anon key här.
  ALDRIG service_role/secret key i denna fil.
*/
const SUPABASE_URL="https://nsoxhkfypddduupncess.supabase.co";
const SUPABASE_KEY="sb_publishable_LfWq6vYppNjHeClZJamCKQ_3Pi9lrVq";
const N=["Pelle","Sanna","Nordborg","Katta","Fredrik","Anna","Johan","Karin"];
let person="",fav=0,db=null;

function loadSupabase(){
  return new Promise((resolve,reject)=>{
    if(window.supabase){resolve();return}
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=()=>window.supabase?resolve():reject(new Error("Supabase-biblioteket laddades inte korrekt."));
    s.onerror=()=>reject(new Error("Kunde inte ladda Supabase-biblioteket från CDN. Kontrollera internetanslutningen."));
    document.head.appendChild(s);
  });
}

async function initApp(){
  try{
    if(!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.startsWith("YOUR_") || SUPABASE_KEY.startsWith("YOUR_")){
      throw new Error("Supabase URL eller Publishable Key saknas i index.html.");
    }
    await loadSupabase();
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    await home();
  }catch(e){
    console.error("Vinprovningen kunde inte starta:",e);
    const msg="Kunde inte starta Vinprovningen: "+(e?.message||e);
    const el=document.getElementById("homeMsg");
    if(el){el.className="notice err";el.textContent=msg}
    else alert(msg);
  }
}
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),norm=x=>String(x||'').trim().toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o');function sec(x){['home','form','admin','results'].forEach(id=>$(id).classList.toggle('hidden',id!==x))}function note(id,t,c=''){ $(id).className='notice '+c;$(id).textContent=t}function ok(){if(!db){note('homeMsg','Supabase är inte ansluten ännu. Ladda om sidan och försök igen.','err');return false}return true}
async function home(){if(!ok())return;sec('home');let{data:e,error}=await db.from('event_settings').select('locked').eq('id',1).single();if(error){note('homeMsg',error.message,'err');return}let{count}=await db.from('participants').select('name',{count:'exact',head:true});$('homeMsg').className='notice ok';$('homeMsg').textContent=e.locked?'🔒 Provningen är låst.':'🟢 '+(count||0)+' av 8 deltagare har svarat.';$('names').innerHTML=N.map(n=>`<button class="name" ${e.locked?'disabled':''} onclick="start('${n}')">${n}</button>`).join('')}
async function start(n){let{data:e}=await db.from('event_settings').select('locked').eq('id',1).single();if(e.locked)return alert('Provningen är låst.');person=n;fav=0;$('ft').textContent=n+'s svar';$('forms').innerHTML=[1,2,3].map(i=>`<div class="wine"><h3>Vin ${i}</h3><label>Vilket land?</label><input id="c${i}" placeholder="Land"><label>Vad kostar det?</label><input id="p${i}" type="number" min="0" step="1" placeholder="Kr"><label>Vad smakar/luktar vinet?</label><textarea id="t${i}" placeholder="Smak, doft, syra, fat..."></textarea></div>`).join('');$('favs').innerHTML=[1,2,3].map(i=>`<button class="secondary" id="f${i}" onclick="favorite(${i})">Vin ${i}</button>`).join('');sec('form')}
function favorite(i){fav=i;[1,2,3].forEach(x=>$('f'+x).className=x===i?'primary':'secondary')}
async function savePerson(){if(!fav)return note('formMsg','Välj favoritvin.','err');let guesses=[1,2,3].map(i=>({country:$('c'+i).value.trim(),price:Number($('p'+i).value),taste:$('t'+i).value.trim()}));if(guesses.some(g=>!g.country||!Number.isFinite(g.price)))return note('formMsg','Fyll i land och pris för alla tre viner.','err');let{error}=await db.from('participants').upsert({name:person,guesses,favorite:fav});if(error)return note('formMsg',error.message,'err');await home();alert('Tack '+person+'! Svaret är sparat centralt.')}
async function admin(){sec('admin');let{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('panel').classList.toggle('hidden',!session);if(session)renderAdmin()}async function login(){let{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)return note('loginMsg',error.message,'err');renderAdmin();$('login').classList.add('hidden');$('panel').classList.remove('hidden')}async function logout(){await db.auth.signOut();admin()}
async function renderAdmin(){let{data:w,error}=await db.from('wines').select('*').order('wine_no');if(error)return note('answerMsg',error.message,'err');$('answers').innerHTML=w.map(x=>`<div class="wine"><h3>Vin ${x.wine_no}</h3><label>Rätt land</label><input id="ac${x.wine_no}" value="${esc(x.country)}"><label>Rätt pris</label><input id="ap${x.wine_no}" type="number" value="${x.price}"><label>Smaknotering</label><textarea id="at${x.wine_no}">${esc(x.taste)}</textarea></div>`).join('');let{data:e}=await db.from('event_settings').select('locked').eq('id',1).single();let{count}=await db.from('participants').select('name',{count:'exact',head:true});$('status').innerHTML=`<p><b>${count||0}/8</b> deltagare har svarat.</p><p>${e.locked?'🔒 Låst':'🟢 Öppen'}</p>`}
async function saveAnswers(){for(let i=1;i<=3;i++){let{error}=await db.from('wines').update({country:$('ac'+i).value.trim(),price:Number($('ap'+i).value),taste:$('at'+i).value.trim()}).eq('wine_no',i);if(error)return note('answerMsg',error.message,'err')}note('answerMsg','Facit sparat.','ok');renderAdmin()}
async function lock(){if(!confirm('Låsa provningen? Deltagarna kan då inte längre ändra svar.'))return;let{error}=await db.from('event_settings').update({locked:true}).eq('id',1);if(error)return alert(error.message);results()}
async function clearParticipants(){if(!confirm('Radera alla deltagarsvar och öppna provningen igen?'))return;let{error}=await db.from('participants').delete().neq('name','');if(error)return alert(error.message);await db.from('event_settings').update({locked:false}).eq('id',1);renderAdmin();alert('Deltagarsvaren är raderade.')}
async function resetAll(){if(!confirm('Radera alla deltagarsvar och facit?'))return;await db.from('participants').delete().neq('name','');await db.from('wines').update({country:'',price:0,taste:''}).gte('wine_no',1);await db.from('event_settings').update({locked:false}).eq('id',1);renderAdmin();alert('Återställt.')}
async function results(){if(!ok())return;sec('results');let{data,error}=await db.rpc('get_results');if(error){$('result').innerHTML='<div class="notice err">'+esc(error.message)+'</div>';return}let w=data.wines,p=data.participants,complete=w.every(x=>x.country&&x.price>0);let rows=p.map(x=>{let pts=0;x.guesses.forEach((g,i)=>{if(complete&&norm(g.country)===norm(w[i].country))pts++;if(complete&&Number(g.price)===Number(w[i].price))pts++});return{...x,points:pts}}).sort((a,b)=>b.points-a.points);let h=complete?'':'<div class="notice">Facit är inte komplett ännu. Poäng visas därför inte som slutresultat.</div>';h+='<h3>Poängtavla</h3><div class="scores">'+rows.map((r,i)=>`<div class="score"><span class="badge">#${i+1}</span><br><b>${esc(r.name)}</b><br><span class="points">${r.points} poäng</span></div>`).join('')+'</div><hr><h3>Detaljer</h3><div style="overflow:auto"><table><tr><th>Person</th><th>Vin 1</th><th>Vin 2</th><th>Vin 3</th><th>Godast</th><th>Poäng</th></tr>';rows.forEach(r=>{h+='<tr><td><b>'+esc(r.name)+'</b></td>';r.guesses.forEach((g,i)=>{let c=complete&&norm(g.country)===norm(w[i].country),q=complete&&Number(g.price)===Number(w[i].price);h+=`<td>${esc(g.country)} (${g.price} kr)<br><span class="badge">${c?'Land ✓':'Land ✗'} · ${q?'Pris ✓':'Pris ✗'}</span><br>${esc(g.taste||'–')}</td>`});h+=`<td>Vin ${r.favorite}</td><td class="points">${r.points}</td></tr>`});h+='</table></div><hr><h3>Favoritvin</h3><div class="scores">'+[1,2,3].map(i=>`<div class="score"><b>Vin ${i}</b><br>${p.filter(x=>x.favorite===i).length} av ${p.length}</div>`).join('')+'</div>';let j=p.find(x=>x.name==='Johan');if(j){let same=p.filter(x=>x.name!=='Johan'&&x.favorite===j.favorite);h+=`<div class="notice ok"><h3>🍷 Johan valde Vin ${j.favorite}</h3><b>${same.length}</b> av de andra ${p.length-1} valde också Vin ${j.favorite}${same.length?': '+same.map(x=>esc(x.name)).join(', ')+'.':'.'}</div>`}if(complete)h+='<hr><h3>Facit</h3><div class="grid">'+w.map(x=>`<div class="wine"><h3>Vin ${x.wine_no}</h3><p><b>Land:</b> ${esc(x.country)}</p><p><b>Pris:</b> ${x.price} kr</p>${x.taste?'<p><b>Smak:</b> '+esc(x.taste)+'</p>':''}</div>`).join('')+'</div>' ;$('result').innerHTML=h}
initApp();</script></body></html>
